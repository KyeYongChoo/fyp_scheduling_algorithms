name = "fyp_scheduling_algorithms"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["FypSchedulingAlgorithms", "SampleSchedulesGen"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3
weak.linter.style.whitespace = false
weak.linter.style.emptyLine = false
weak.linter.style.longLine = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

[[lean_lib]]
name = "FypSchedulingAlgorithms"

# Not part of the proofs: compiling its only module, `SampleSchedulesGen`, rewrites the CSVs in
# SampleSchedules/ (see README.md), so `lake build` refreshes them whenever the schedulers or
# the sample data change.
[[lean_lib]]
name = "SampleSchedulesGen"
roots = ["SampleSchedulesGen"]
