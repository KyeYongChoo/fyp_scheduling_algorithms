name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read # Read access to repository contents
  pages: write # Write access to GitHub Pages
  id-token: write # Write access to ID tokens

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      # lean-action's own `lake exe cache get` has no retry, and a dropped connection to
      # cache.mathlib.org fails the whole run.  A retry only downloads the missing files.
      - name: Get Mathlib cache (up to 3 attempts)
        run: |
          for attempt in 1 2 3; do
            lake exe cache get && exit 0
            echo "::warning::lake exe cache get failed (attempt $attempt of 3)"
            sleep 15
          done
          exit 1
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: false
      - uses: leanprover-community/docgen-action@v1
